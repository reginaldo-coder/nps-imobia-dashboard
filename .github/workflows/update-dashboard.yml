name: Atualizar Dashboard NPS

on:
  # Roda a cada hora das 08h às 19h, de segunda a sexta (horário de Brasília = UTC-3)
  # Cron usa UTC: 08h BRT = 11h UTC, 19h BRT = 22h UTC
  schedule:
    - cron: "0 11-22 * * 1-5"

  # Permite rodar manualmente pelo botão "Run workflow" no GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # necessário para fazer commit do index.html gerado

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install slack-sdk

      - name: Gerar dashboard
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python generate_dashboard.py

      - name: Commitar e publicar index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # Só faz commit se houver mudança real
          git diff --cached --quiet && echo "Sem mudanças." || \
          git commit -m "chore: atualiza dashboard NPS $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
